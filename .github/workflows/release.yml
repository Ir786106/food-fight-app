name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build release APK
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mv build/app/outputs/flutter-apk/app-release.apk food-fight-v${VERSION}.apk

      - name: Generate SHA-256 checksum
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sha256sum food-fight-v${VERSION}.apk > food-fight-v${VERSION}.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            food-fight-v${{ steps.version.outputs.VERSION }}.apk
            food-fight-v${{ steps.version.outputs.VERSION }}.apk.sha256
          body: |
            ## Food Fight v${{ steps.version.outputs.VERSION }}
            
            ### Installation
            Download `food-fight-v${{ steps.version.outputs.VERSION }}.apk` and install it.
            
            > ⚠️ **First release-signed build**: Users with a debug-signed APK must uninstall the old version first due to signature change. After this one-time step, in-app updates will work automatically.
            
            Build: ${{ github.run_number }}
