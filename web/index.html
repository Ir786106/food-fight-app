<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Food Fight - Digital Fast Food Ordering & Multi-Branch Restaurant Management App">
  <meta name="google-signin-client_id" content="585587375994-h4ohhnrmellh0ooboa0gpdp9pq2v0m86.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Food Fight">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Food Fight - Fast Food Ordering System</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API for web live tracking -->
  <script src="https://maps.googleapis.com/maps/api/js?key="></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FAF7F2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #FFFDF8 0%, #FAF7F2 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: #FFD505;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(255, 213, 5, 0.4);
      margin-bottom: 24px;
      font-size: 48px;
    }
    .splash-title {
      font-size: 22px;
      font-weight: 800;
      color: #6D2123;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .splash-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #8F807C;
      margin-bottom: 28px;
    }
    .splash-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(109, 33, 35, 0.15);
      border-top-color: #6D2123;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-logo">🥊</div>
    <div class="splash-title">Food Fight</div>
    <div class="splash-subtitle">Loading kitchen fresh menu...</div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          splash.remove();
        }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
