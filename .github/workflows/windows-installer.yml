name: Windows installer

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.x'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Get-Content pubspec.yaml | Select-String '^version: (\d+\.\d+\.\d+)\+([1-9]\d*)$'
          if (!$versionLine) { throw 'Missing app version in pubspec.yaml' }
          $version = $versionLine.Matches[0].Groups[1].Value
          $build = $versionLine.Matches[0].Groups[2].Value
          $bundle = Resolve-Path build/windows/x64/runner/Release
          foreach ($file in @('food_fight.exe', 'flutter_windows.dll', 'data/icudtl.dat', 'data/app.so')) {
            if (!(Test-Path (Join-Path $bundle $file) -PathType Leaf)) { throw "Bundle is missing $file" }
          }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler "/DAppVersion=$version" "/DAppBuild=$build" "/DBundleDir=$bundle" /Odist windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-Item "dist/FoodFight-$version-Windows-x64-Setup.exe"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: FoodFight-Windows-Installer
          path: |
            dist/FoodFight-*-Windows-x64-Setup.exe
            dist/FoodFight-*-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
