name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Check English and Urdu catalogs
        run: node tool/localization_catalog.cjs

      - name: Flutter format check
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test (including Responsive Device Matrix)
        run: flutter test --coverage

      - name: Build Web (Release)
        run: flutter build web --release

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
        continue-on-error: true

  firestore-rules-test:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Rules Test Dependencies
        working-directory: test/rules
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      - name: Run backend unit tests
        run: npm test --prefix functions

      - name: Run Firestore Rules Tests in Emulator
        run: firebase emulators:exec --config firebase.demo.json --project demo-food-fight --only firestore "npm --prefix test/rules test"

      - name: Run lifecycle and callable integration tests
        env:
          GCLOUD_PROJECT: demo-food-fight
        run: |
          firebase emulators:exec --config firebase.demo.json --project demo-food-fight --only auth,firestore "node --test functions/order_lifecycle.emulator.test.js"
          firebase emulators:exec --config firebase.demo.json --project demo-food-fight --only auth,firestore "node --test functions/platform_administration.emulator.test.js"
          firebase emulators:exec --config firebase.demo.json --project demo-food-fight --only firestore "node --test functions/migrate_legacy_tenants.emulator.test.js"
          firebase emulators:exec --inspect-functions --config firebase.demo.json --project demo-food-fight --only auth,firestore,functions "node --test functions/platform_callable.emulator.test.js"

